        function renderIntro() {
            const container = document.getElementById('exhibitionIntro');
            const dataObj = introData[currentLang];

            container.innerHTML = `
                <div class="mb-6 border-b border-neutral-200 pb-4">
                    <h1 class="text-2xl sm:text-4xl font-bold text-neutral-900 serif-title mb-1">${dataObj.mainTitle}</h1>
                    <span class="text-sm sm:text-base font-semibold tracking-wider text-neutral-500 italic block">${dataObj.subTitle}</span>
                </div>

                <!-- Quote Block 1 -->
                <blockquote class="bg-neutral-100 border-l-4 border-neutral-800 p-4 sm:p-5 rounded-r-lg my-6 text-sm sm:text-base italic text-neutral-800 whitespace-pre-line leading-relaxed">
                    ${dataObj.quote1}
                </blockquote>

                <div class="space-y-4 text-sm sm:text-base text-neutral-700 leading-relaxed mb-6">
                    <p>${dataObj.p1}</p>
                </div>

                <div class="text-base sm:text-lg font-bold text-neutral-900 border-l-4 border-neutral-900 pl-4 py-1 my-6">
                    ${dataObj.themeQuote}
                </div>

                <div class="space-y-4 text-sm sm:text-base text-neutral-700 leading-relaxed">
                    <p class="whitespace-pre-line">${dataObj.shadowText}</p>
                </div>

                <div class="bg-neutral-900 text-white p-5 rounded-xl text-center text-sm sm:text-base font-medium whitespace-pre-line shadow-sm mt-8">
                    ${dataObj.callout}
                </div>
            `;
        }

        function renderExhibition() {
            const grid = document.getElementById('exhibitionGrid');
            grid.innerHTML = '';

            data.forEach((item) => {
                const room = currentLang === 'zh' ? item.room : item.roomEn;
                const partner = currentLang === 'zh' ? item.partnerZh : item.partnerEn;
                const title = currentLang === 'zh' ? item.titleZh : item.titleEn;
                const desc = currentLang === 'zh' ? item.descZh : item.descEn;

                const partnerLabel = currentLang === 'zh' ? '參展單位' : 'Exhibitor';
                const exhibitLabel = currentLang === 'zh' ? '展品介紹' : 'Exhibit Description';

                const formattedDesc = desc.split('\n').map(p => `<p class="mb-2 leading-relaxed text-neutral-800">${p}</p>`).join('');

                const card = document.createElement('div');
                card.className = "bg-white border border-neutral-200 rounded-xl p-6 shadow-sm hover:shadow-md transition-shadow flex flex-col justify-between";
                
                card.innerHTML = `
                    <div>
                        <div class="flex justify-between items-start mb-3 border-b border-neutral-100 pb-3">
                            <span class="text-xs font-bold px-2.5 py-1 bg-neutral-100 text-neutral-800 rounded-md border border-neutral-200">
                                【${item.id}/14】${room}
                            </span>
                        </div>

                        <!-- 參展單位 -->
                        <div class="mb-4">
                            <span class="text-xs font-semibold text-neutral-500 uppercase tracking-wider block mb-1">${partnerLabel}</span>
                            <h3 class="text-base font-bold text-neutral-900">${partner}</h3>
                        </div>

                        <!-- 展品名稱與內容 -->
                        <div class="pt-3 border-t border-dashed border-neutral-200">
                            <span class="text-xs font-semibold text-neutral-500 uppercase tracking-wider block mb-1">${exhibitLabel}</span>
                            <h4 class="text-lg font-bold text-neutral-900 serif-title mb-3">${title}</h4>
                            <div class="text-sm text-neutral-700">
                                ${formattedDesc}
                            </div>
                        </div>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        function toggleLanguage() {
            currentLang = currentLang === 'zh' ? 'en' : 'zh';
            
            document.getElementById('langBtnText').innerText = currentLang === 'zh' ? 'Switch to English' : '切換為中文';
            document.getElementById('roomsHeader').innerText = currentLang === 'zh' 
                ? '參展夥伴／展間介紹 (14個展區)' 
                : 'Participating Partners & Exhibition Rooms (14 Rooms)';

            renderIntro();
            renderExhibition();
        }

        // Initial Load
        renderIntro();
        renderExhibition();
    </script>
